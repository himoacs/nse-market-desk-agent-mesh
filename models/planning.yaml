kind: model
name: planning
description: >-
  SAM's built-in planning model (used by SAM's Builder and for chat titles), pointed at the
  same LLM as the desk. Optional: applied only by manifests/builtin-models.yaml
  (scripts/bootstrap.py --builtin-models).
spec:
  alias: planning
  provider: ${LLM_PROVIDER, custom}
  modelName: ${LLM_MODEL_NAME}
  apiBase: ${LLM_API_BASE:-}
  authConfig:
    type: apikey
    api_key: ${LLM_API_KEY}
  modelParams:
    cache_strategy: 5m
