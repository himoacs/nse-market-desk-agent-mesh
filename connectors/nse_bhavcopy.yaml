# Generated by scripts/refresh_nse_connectors.py; edit the script, not this file.
kind: connector
name: nse_bhavcopy
description: >-
  NSE official MCP server, end-of-day (bhavcopy) data for NSE cash-market equities over the last ~5 years: daily OHLCV history, breadth (advances/declines), top movers and volume, compare_stocks returns and drawdown, bulk quotes, 52-week high/low, moving averages, volume analysis, corporate actions and symbol search. Latest data is the previous trading day.
spec:
  type: mcp
  subtype: remote
  values:
    server_url: "https://mcp.nseindia.in/bhavcopy/cm/mcp"
    connection_type: "streamable-http"
    auth_type: "none"
    manifest:
      - {"name": "get_top_by_volume", "description": "Get the top N most actively traded NSE stocks on a specific date, sorted descending.\nSort by 'volume' (traded quantity) or 'value' (turnover in ₹).\nIf the exact date is a holiday/weekend, returns the nearest trading day.\n\nDisclaimer: Information/Data made available through the NSEIL MCP server is for informational and educational purposes only and does not constitute investment advice or recommendation. NSEIL is not responsible for any AI generated Output or predictions", "inputSchema": {"type": "object", "properties": {"date": {"type": "string", "description": "Date in yyyy-MM-dd format. Use today's date for current data."}, "n": {"type": "integer", "description": "Number of stocks to return. Default: 10, Max: 50"}, "sortBy": {"type": "string", "description": "Sort metric: 'volume' (traded quantity, default) or 'value' (turnover in ₹)."}}, "required": ["date", "n", "sortBy"], "additionalProperties": false}}
      - {"name": "get_top_movers", "description": "Get the top N gaining or losing NSE stocks on a specific date.\nReturns stocks sorted by % change with OHLCV details.\nIf the exact date is a holiday/weekend, returns the nearest trading day.\n\nNote: prices are raw NSE bhavcopy data with no split/bonus adjustment. Do not call get_corporate_actions automatically; the desk analyst flags likely distortions, and get_corporate_actions is called only when corporate actions are requested.\n\nDisclaimer: Information/Data made available through the NSEIL MCP server is for informational and educational purposes only and does not constitute investment advice or recommendation. NSEIL is not responsible for any AI generated Output or predictions", "inputSchema": {"type": "object", "properties": {"date": {"type": "string", "description": "Date in yyyy-MM-dd format. Use today's date for current data."}, "n": {"type": "integer", "description": "Number of stocks to return. Default: 10, Max: 50"}, "direction": {"type": "string", "description": "Direction: 'gain' for top gainers, 'loss' for top losers."}}, "required": ["date", "n", "direction"], "additionalProperties": false}}
      - {"name": "get_volume_analysis", "description": "Analyse trading volume trends for an NSE stock over N trading days.\nReturns: average volume, max/min volume, volume spike days (>2× avg), 5-day recent trend.\n\nDisclaimer: Information/Data made available through the NSEIL MCP server is for informational and educational purposes only and does not constitute investment advice or recommendation. NSEIL is not responsible for any AI generated Output or predictions.", "inputSchema": {"type": "object", "properties": {"symbol": {"type": "string", "description": "NSE stock symbol in uppercase. Example: RELIANCE, ICICIBANK"}, "days": {"type": "integer", "description": "Number of trading days to analyse. Min: 5, Max: 252. Default: 30"}}, "required": ["symbol", "days"], "additionalProperties": false}}
      - {"name": "nse_lookup_symbol", "description": "Look up NSE ticker symbols by partial name or keyword. Returns matching ticker list only — no price data.\nUse this to find the exact NSE symbol before calling other tools.\nFaster and lighter than search_symbols when you only need the ticker.\n\nExamples:\n  query=HDFC   → [HDFC, HDFCBANK, HDFCLIFE, HDFCAMC, ...]\n  query=TATA   → [TATA, TATASTEEL, TATAMOTORS, TATACOMM, ...]\n  query=BANK   → [BANKBARODA, BANKINDIA, CANBK, ...]", "inputSchema": {"type": "object", "properties": {"query": {"type": "string", "description": "Partial symbol or keyword to search. Case-insensitive. Examples: 'HDFC', 'TATA', 'RELIANCE'"}}, "required": ["query"], "additionalProperties": false}}
      - {"name": "get_stock_history", "description": "Get daily OHLCV (Open, High, Low, Close, Volume) price history for an NSE stock.\nReturns up to 3 months per call to keep response size manageable.\nFor longer periods, chain calls using next_end_date from each response.\n\nExample — fetch 1 year of RELIANCE:\n  Call 1: symbol=RELIANCE, months=3  (end_date omitted → uses today)\n  Call 2: symbol=RELIANCE, months=3, end_date={next_end_date from call 1}\n  Call 3: symbol=RELIANCE, months=3, end_date={next_end_date from call 2}\n  Call 4: symbol=RELIANCE, months=3, end_date={next_end_date from call 3}\n\nFor 2 years: repeat 8 times. Each call returns next_end_date for the next chunk.\nIf symbol not found, use search_symbols to find the correct symbol.\n\nNote: prices are raw NSE bhavcopy data with no split/bonus adjustment. Do not call get_corporate_actions automatically; the desk analyst flags likely distortions, and get_corporate_actions is called only when corporate actions are requested.\n\nDisclaimer: Information/Data made available through the NSEIL MCP server is for informational and educational purposes only and does not constitute investment advice or recommendation. NSEIL is not responsible for any AI generated Output or predictions.", "inputSchema": {"type": "object", "properties": {"symbol": {"type": "string", "description": "NSE stock symbol in uppercase. Examples: RELIANCE, TCS, INFY, HDFCBANK, WIPRO"}, "months": {"type": "integer", "description": "Months to fetch in this chunk. Max 3. Default: 3. Pass 0 for default."}, "endDate": {"type": "string", "description": "End date for this chunk in yyyy-MM-dd format. Omit or pass 'today' for latest data. Pass next_end_date from a previous response to fetch older chunks."}}, "required": ["symbol", "months", "endDate"], "additionalProperties": false}}
      - {"name": "search_symbols", "description": "Search for NSE stock symbols by company name or partial symbol.\nReturns matching symbols with latest close price and % change.\nUse this when you do not know the exact NSE symbol for a company.\n\nDisclaimer: Information/Data made available through the NSEIL MCP server is for informational and educational purposes only and does not constitute investment advice or recommendation. NSEIL is not responsible for any AI generated Output or predictions.", "inputSchema": {"type": "object", "properties": {"query": {"type": "string", "description": "Search query — company name, partial symbol, or keyword. Examples: 'TATA', 'HDFC', 'BANK'"}}, "required": ["query"], "additionalProperties": false}}
      - {"name": "get_market_breadth", "description": "Get overall NSE market breadth for a trading date.\nReturns: total stocks, advances, declines, unchanged count, A/D ratio, total market volume.\nA/D ratio > 1.5 indicates a bullish day; A/D ratio < 0.7 indicates a bearish day.\n\nDisclaimer: Information/Data made available through the NSEIL MCP server is for informational and educational purposes only and does not constitute investment advice or recommendation. NSEIL is not responsible for any AI generated Output or predictions", "inputSchema": {"type": "object", "properties": {"date": {"type": "string", "description": "Date in yyyy-MM-dd format. Returns nearest trading day if holiday."}}, "required": ["date"], "additionalProperties": false}}
      - {"name": "get_corporate_actions", "description": "Fetch actual NSE corporate action events for a stock directly from NSE India.\nReturns splits, bonus issues, dividends, and other events with exact ex-dates.\nData cached in Redis for 24 hours — first call per symbol takes ~2s for NSE fetch.\n\nUse when corporate actions are requested, or to confirm whether a specific large price move is a split/bonus ex-date. The adjustmentFactor field tells you how to interpret pre-event prices: 1:1 bonus -> 0.5, 10->2 split -> 0.2.\n\nReturns: list of CA events with exDate, purpose (raw NSE text), actionType (SPLIT/BONUS/DIVIDEND/OTHER), adjustmentFactor.\n\nDisclaimer: Information/Data made available through the NSEIL MCP server is for informational and educational purposes only and does not constitute investment advice or recommendation. NSEIL is not responsible for any AI generated Output or predictions.", "inputSchema": {"type": "object", "properties": {"symbol": {"type": "string", "description": "NSE stock symbol in uppercase. Example: INFY, BRIGADE, RELIANCE"}, "fromDate": {"type": "string", "description": "Start date yyyy-MM-dd. Default: 5 years ago."}, "toDate": {"type": "string", "description": "End date yyyy-MM-dd. Default: today."}}, "required": ["symbol", "fromDate", "toDate"], "additionalProperties": false}}
      - {"name": "compare_stocks", "description": "Compare multiple NSE stocks side-by-side over a time period.\nReturns % return for each stock ranked best to worst, plus max drawdown per stock.\nPass up to 10 valid NSE symbols.\n\nNote: prices are raw NSE bhavcopy data with no split/bonus adjustment. Do not call get_corporate_actions automatically; the desk analyst flags likely distortions, and get_corporate_actions is called only when corporate actions are requested.\n\nDisclaimer: Information/Data made available through the NSEIL MCP server is for informational and educational purposes only and does not constitute investment advice or recommendation. NSEIL is not responsible for any AI generated Output or predictions", "inputSchema": {"type": "object", "properties": {"symbols": {"type": "array", "items": {"type": "string"}, "description": "List of NSE symbols to compare. Example: [\"TCS\", \"INFY\", \"WIPRO\"]. Max 10."}, "months": {"type": "integer", "description": "Number of months to compare. 1–24. Default: 6"}}, "required": ["symbols", "months"], "additionalProperties": false}}
      - {"name": "get_ltp_by_date", "description": "Returns the last traded price (close price) for a given NSE symbol on a specific date.\nIf the date is a non-trading day, returns the previous available trading day's price.\n\nDisclaimer: Information/Data made available through the NSEIL MCP server is for informational and educational purposes only and does not constitute investment advice or recommendation. NSEIL is not responsible for any AI generated Output or predictions.", "inputSchema": {"type": "object", "properties": {"symbol": {"type": "string", "description": "NSE stock symbol in uppercase. Example: RELIANCE"}, "date": {"type": "string", "description": "Date in yyyy-MM-dd format."}}, "required": ["symbol", "date"], "additionalProperties": false}}
      - {"name": "get_bulk_quote", "description": "Get the latest available price snapshot for multiple NSE stocks in one call.\nReturns: open, high, low, close, prev close, % change, volume, and date for each symbol.\n\nDisclaimer: Information/Data made available through the NSEIL MCP server is for informational and educational purposes only and does not constitute investment advice or recommendation. NSEIL is not responsible for any AI generated Output or predictions.", "inputSchema": {"type": "object", "properties": {"symbols": {"type": "array", "items": {"type": "string"}, "description": "List of NSE symbols. Example: [\"RELIANCE\", \"TCS\", \"INFY\", \"HDFCBANK\"]. Max 50."}}, "required": ["symbols"], "additionalProperties": false}}
      - {"name": "moving_average", "description": "Calculates the simple moving average (SMA) of close prices for a stock over the last N trading days.\nCommon periods: 20-day (short-term), 50-day (medium-term), 200-day (long-term).\n\nDisclaimer: Information/Data made available through the NSEIL MCP server is for informational and educational purposes only and does not constitute investment advice or recommendation. NSEIL is not responsible for any AI generated Output or predictions.", "inputSchema": {"type": "object", "properties": {"symbol": {"type": "string", "description": "NSE stock symbol in uppercase. Example: HINDALCO"}, "days": {"type": "integer", "description": "Number of trading days. Common values: 20, 50, 100, 200"}}, "required": ["symbol", "days"], "additionalProperties": false}}
      - {"name": "get_52_week_high_low", "description": "Get the 52-week high and low prices for an NSE stock.\nReturns: 52w high/low with dates, current price position within range, % distance from each extreme.\n\nNote: prices are raw NSE bhavcopy data with no split/bonus adjustment. Do not call get_corporate_actions automatically; the desk analyst flags likely distortions, and get_corporate_actions is called only when corporate actions are requested.\n\nDisclaimer: Information/Data made available through the NSEIL MCP server is for informational and educational purposes only and does not constitute investment advice or recommendation. NSEIL is not responsible for any AI generated Output or predictions.", "inputSchema": {"type": "object", "properties": {"symbol": {"type": "string", "description": "NSE stock symbol in uppercase. Example: RELIANCE, TCS, INFY"}}, "required": ["symbol"], "additionalProperties": false}}
