    manifest:
      - {"name": "nse_get_market_movers", "description": "PRIMARY TOOL for: \"What are the top gainers today?\", \"top losers today?\", \"market movers\", \"best/worst performing stocks\", \"biggest gainers/losers\".\n\nReturns top N gainers (sorted by highest % gain) and top N losers (sorted by biggest % loss), from all NSE securities by default or filtered to a specific index.\n\nindexName — leave NULL or empty for ALL securities (broadest view, recommended default):\n  null / \"\"        — All NSE-listed securities (allSec, ~1500+ stocks)\n  \"NIFTY\"          — NIFTY 50 stocks only\n  \"BANKNIFTY\"      — Bank NIFTY stocks only\n  \"NIFTYNEXT50\"    — NIFTY Next 50 stocks only\n\nWhen user asks \"top gainers/losers today\" WITHOUT specifying an index: pass indexName=null or \"\".\nOnly pass NIFTY/BANKNIFTY/NIFTYNEXT50 if user explicitly asks for that specific index.\n\nFields: symbol, series, ltp, prev_price, net_price, perChange, trade_quantity, turnover.\n\nSEBI Disclaimer: For educational and research purposes only. Not investment advice. Past performance is not indicative of future results. Consult a SEBI-registered advisor before investing.", "inputSchema": {"type": "object", "properties": {"indexName": {"type": "string", "description": "Index filter: null or empty for ALL securities (default), or NIFTY, BANKNIFTY, NIFTYNEXT50"}, "limit": {"type": "integer", "description": "Max stocks per direction (default 10, max 50). Pass 0 for default."}}, "required": ["indexName", "limit"], "additionalProperties": false}}
      - {"name": "nse_get_gainers", "description": "Get top N NSE stocks by % gain, flattened across all indices and sorted descending.\nIdeal for dashboard display — e.g., \"show today's top 10 gainers\".\n\nSEBI Disclaimer: For educational and research purposes only. Not investment advice. Past performance is not indicative of future results. Consult a SEBI-registered advisor before investing.", "inputSchema": {"type": "object", "properties": {"limit": {"type": "integer", "description": "Max stocks to return (default 10, max 50). Pass 0 for default."}}, "required": ["limit"], "additionalProperties": false}}
      - {"name": "nse_get_losers", "description": "Get top N NSE stocks by % loss, flattened across all indices and sorted ascending.\nIdeal for risk alerts — e.g., \"flag biggest intraday losers\".\n\nSEBI Disclaimer: For educational and research purposes only. Not investment advice. Past performance is not indicative of future results. Consult a SEBI-registered advisor before investing.", "inputSchema": {"type": "object", "properties": {"limit": {"type": "integer", "description": "Max stocks to return (default 10, max 50). Pass 0 for default."}}, "required": ["limit"], "additionalProperties": false}}
      - {"name": "cm_get_live_market_data", "description": "Get live NSE market data for a specific variation type.\nValid index values:\n  - gainers : top gaining stocks\n  - loosers : top losing stocks\nData refreshes every 5 minutes.\n\nSEBI Disclaimer: For educational and research purposes only. Not investment advice. Consult a SEBI-registered advisor before investing.", "inputSchema": {"type": "object", "properties": {"index": {"type": "string", "description": "Variation type: 'gainers' or 'loosers'"}}, "required": ["index"], "additionalProperties": false}}
      - {"name": "cm_get_stock_quote", "description": "Get latest live quote for a specific NSE CM stock by exact symbol.\nWorks for any segment (equity, SME, bonds, call auction).\nReturns full price data: LTP, open, high, low, change, % change, volume, 52w range, series, latestTimestamp.\n\nDisclaimer: Information/Data made available through the NSEIL MCP server is for informational and educational purposes only and does not constitute investment advice or recommendation. NSEIL is not responsible for any AI generated Output or predictions.", "inputSchema": {"type": "object", "properties": {"symbol": {"type": "string", "description": "Exact NSE symbol (e.g. 'RELIANCE', 'TCS', 'INFY', '1048IIFL27')"}}, "required": ["symbol"], "additionalProperties": false}}
      - {"name": "cm_get_equity_stocks", "description": "Get latest live data for NSE Capital Market EQUITY stocks (series: EQ, BE, BL, BT, IL, IQ).\nReturns symbol, LTP, open, high, low, change, % change, volume, 52w range.\nUse limit to cap results. Use symbolFilter for prefix search (e.g. \"RELI\" → RELIANCE).\nData refreshes every 1 minute.\n\nDisclaimer: Information/Data made available through the NSEIL MCP server is for informational and educational purposes only and does not constitute investment advice or recommendation. NSEIL is not responsible for any AI generated Output or predictions.", "inputSchema": {"type": "object", "properties": {"limit": {"type": "integer", "description": "Max stocks to return (default 100, max 500). Pass 0 for default."}, "symbolFilter": {"type": "string", "description": "Symbol prefix filter (e.g. 'RELI'). Empty string for all equity stocks."}}, "required": ["limit", "symbolFilter"], "additionalProperties": false}}
      - {"name": "cm_get_data_status", "description": "Check freshness of NSE live market data.\nShows when gainers and losers data was last crawled from NSE.\nUse this to verify data is up-to-date before querying.", "inputSchema": {"type": "object", "properties": {}, "required": [], "additionalProperties": false}}
      - {"name": "cm_get_allstocks_status", "description": "Check freshness of NSE allstocks data cache.\nShows when last crawled, whether data is available, and segment-wise stock counts.", "inputSchema": {"type": "object", "properties": {}, "required": [], "additionalProperties": false}}
