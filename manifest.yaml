kind: manifest
name: nse-market-desk
description: >-
  NSE Market Desk: five agents over the NSE MCP server. Apply with
  scripts/bootstrap.py, or directly with: sam config apply --target desktop
target:
  name: desktop
resources:
  models:
    - nse_sonnet
  toolsets:
    - nse_analytics
    - nse_publishing
  skills:
    - nse-analysis-methodology
    - nse-chart-styles
    - nse-briefing-templates
  connectors:
    - nse_bhavcopy
    - nse_cm_market
  agents:
    - nse_market_data
    - nse_market_analyst
    - nse_chart_studio
    - nse_briefing_writer
    - nse_desk_head
