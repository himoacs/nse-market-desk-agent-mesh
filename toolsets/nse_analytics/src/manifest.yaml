version: 1
# Toolset build: `sam config apply` runs build.sh (pip install --target
# dist/<os>-<arch>/python .) once for this src/, dropping every
# [project.scripts] console script at python/bin/<name>, which is what each
# executable below points to.
tools:
  get_nifty50_universe:
    runtime: python
    executable: python/bin/get_nifty50_universe
    timeout_seconds: 30
  sector_rotation:
    runtime: python
    executable: python/bin/sector_rotation
    timeout_seconds: 60
  breadth_trend:
    runtime: python
    executable: python/bin/breadth_trend
    timeout_seconds: 60
  live_sector_tilt:
    runtime: python
    executable: python/bin/live_sector_tilt
    timeout_seconds: 60
