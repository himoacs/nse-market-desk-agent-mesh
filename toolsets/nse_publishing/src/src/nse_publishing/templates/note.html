<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  @page { size: A4; margin: 16mm 14mm 18mm 14mm; }
  * { box-sizing: border-box; }
  body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; color: #1f2328; font-size: 10.5pt; line-height: 1.45; margin: 0; }
  header { border-bottom: 3px solid #00c895; padding-bottom: 8px; margin-bottom: 14px; }
  .kicker { font-size: 8.5pt; letter-spacing: .08em; text-transform: uppercase; color: #5b6470; }
  header h1 { font-size: 19pt; margin: 2px 0 4px; }
  .meta { font-size: 9pt; color: #5b6470; }
  main > p:first-child { font-size: 12pt; font-weight: 600; background: #f3f7f6; border-left: 4px solid #00c895; padding: 8px 12px; margin: 0 0 14px; }
  h1, h2 { font-size: 12.5pt; margin: 16px 0 6px; padding-bottom: 3px; border-bottom: 1px solid #e3e6ea; break-after: avoid; }
  h3 { font-size: 11pt; margin: 12px 0 4px; break-after: avoid; }
  ul, ol { margin: 4px 0 8px 18px; padding: 0; }
  li { margin: 2px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 9.5pt; margin: 6px 0 10px; break-inside: avoid; }
  th, td { padding: 4px 6px; border-bottom: 1px solid #e3e6ea; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { background: #f6f8fa; font-weight: 600; }
  figure { margin: 8px 0 12px; text-align: center; break-inside: avoid; }
  figure img { width: 100%; max-width: 175mm; height: auto; border: 1px solid #e3e6ea; }
  figcaption { font-size: 8.5pt; color: #5b6470; margin-top: 3px; }
  em { color: #5b6470; }
  footer { margin-top: 18px; padding-top: 8px; border-top: 1px solid #e3e6ea; font-size: 8pt; color: #5b6470; }
</style>
</head>
<body>
<header>
  <div class="kicker">NSE Market Desk · {{PRODUCT}}</div>
  <h1>{{TITLE}}</h1>
  <div class="meta">Prepared by the NSE Market Desk agent mesh on Solace Agent Mesh · rendered {{RENDERED_AT}}</div>
</header>
<main>
{{BODY}}
</main>
<footer>Data: NSE MCP server. For informational and educational purposes only; not investment advice.</footer>
</body>
</html>
